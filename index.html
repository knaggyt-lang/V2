<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptFlow - Handwriting Speed Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Indie+Flower&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --canvas-bg: #ffffff;
            --paper-line: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 0.5rem;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        .tab-content.active {
            display: flex;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
        }

        /* Calibration Tab */
        .calibration-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .calibration-container {
                grid-template-columns: 1fr;
            }
        }

        .canvas-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .char-prompt {
            font-size: 1.25rem;
            color: var(--text-muted);
        }

        .target-char {
            font-size: 4rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .canvas-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            background: var(--canvas-bg);
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        canvas {
            touch-action: none;
            cursor: crosshair;
        }

        .canvas-guides {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 0;
        }

        .guide-line {
            width: 100%;
            border-bottom: 1px dashed #cbd5e1;
        }

        .guide-line.base {
            border-bottom: 2px solid #94a3b8;
        }

        .canvas-controls {
            display: flex;
            gap: 1rem;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 0.5rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .char-item {
            aspect-ratio: 1;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            position: relative;
        }

        .char-item.active {
            border-color: var(--accent);
            background-color: rgba(99, 102, 241, 0.1);
        }

        .char-item.done::after {
            content: '';
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
        }

        /* Reader Tab */
        .reader-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="range"] {
            accent-color: var(--accent);
            width: 150px;
        }

        select, input[type="text"] {
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            outline: none;
        }

        .display-box {
            height: 250px;
            background-color: var(--canvas-bg);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .reader-word {
            font-size: 4rem;
            color: #1e293b;
            white-space: nowrap;
        }

        .reader-word img {
            height: 80px;
            vertical-align: middle;
        }

        .preset-font-1 { font-family: 'Caveat', cursive; font-size: 5.5rem; }
        .preset-font-2 { font-family: 'Dancing Script', cursive; font-size: 4.5rem; }
        .preset-font-3 { font-family: 'Indie Flower', cursive; font-size: 4.5rem; }

        .focus-indicator {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background-color: rgba(99, 102, 241, 0.15);
            pointer-events: none;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            color: var(--text-main);
            resize: vertical;
            outline: none;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        /* Page View */
        .paper-view {
            background-color: var(--canvas-bg);
            border-radius: 0.5rem;
            padding: 3rem;
            min-height: 400px;
            color: #1e293b;
            background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
            background-size: 100% 2.5rem;
            line-height: 2.5rem;
            font-size: 1.8rem;
        }

        .handwriting-container {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
        }

        .handwriting-container img {
            height: 2rem;
            margin-right: 2px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>⚡</span> ScriptFlow
        </div>
        <nav>
            <button class="nav-btn active" onclick="switchTab('reader')">Speed Reader</button>
            <button class="nav-btn" onclick="switchTab('calibrate')">Handschrift Kalibrieren</button>
            <button class="nav-btn" onclick="switchTab('page')">Vorschau</button>
        </nav>
    </header>

    <main>
        <!-- SPEED READER TAB -->
        <div id="tab-reader" class="tab-content active">
            <div class="card display-box">
                <div class="focus-indicator"></div>
                <div id="reader-display" class="reader-word preset-font-1">Bereit</div>
            </div>

            <div class="card reader-controls">
                <div class="control-group">
                    <button id="btn-play" class="btn" onclick="togglePlay()">Start</button>
                    <button class="btn btn-secondary" onclick="resetReader()">Zurücksetzen</button>
                </div>

                <div class="control-group">
                    <label for="wpm-slider">Tempo: <span id="wpm-val" style="color:var(--accent)">300</span> WPM</label>
                    <input type="range" id="wpm-slider" min="100" max="3000" step="50" value="300" oninput="updateWPM(this.value)">
                </div>

                <div class="control-group">
                    <label for="font-select">Schriftart:</label>
                    <select id="font-select" onchange="updateFontSource(this.value)">
                        <option value="custom">Meine Handschrift</option>
                        <option value="preset-1" selected>Schulschrift</option>
                        <option value="preset-2">Elegant</option>
                        <option value="preset-3">Lässig</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <label style="display:block; margin-bottom:0.5rem;">Eingabetext:</label>
                <textarea id="text-input" placeholder="Füge deinen Text hier ein..." oninput="prepareText()">Willkommen bei ScriptFlow. Dieses Tool ermöglicht es dir, Texte Wort für Wort in extrem hoher Geschwindigkeit zu lesen. Du kannst sogar deine eigene Handschrift kalibrieren und verwenden!</textarea>
            </div>
        </div>

        <!-- CALIBRATION TAB -->
        <div id="tab-calibrate" class="tab-content">
            <div class="card">
                <h2>Handschrift-Erfassung</h2>
                <p style="color:var(--text-muted); margin-top:0.25rem;">Zeichne jeden Buchstaben 2-mal. Umlaute und Satzzeichen sind am Ende der Liste!</p>
            </div>

            <div class="calibration-container">
                <div class="card canvas-area">
                    <div class="char-prompt">Zeichne den Buchstaben:</div>
                    <div class="target-char" id="target-char-display">A</div>
                    <div class="char-prompt" style="font-size:0.9rem;" id="sample-count-display">Durchgang 1 von 2</div>

                    <div class="canvas-wrapper">
                        <div class="canvas-guides">
                            <div class="guide-line"></div>
                            <div class="guide-line base"></div>
                            <div class="guide-line"></div>
                        </div>
                        <canvas id="paint-canvas" width="280" height="280"></canvas>
                    </div>

                    <div class="canvas-controls">
                        <button class="btn btn-secondary" onclick="clearCanvas()">Löschen</button>
                        <button class="btn" onclick="saveCharacter()">Speichern & Weiter</button>
                    </div>
                </div>

                <div class="card">
                    <label style="display:block; margin-bottom:1rem;">Fortschritt:</label>
                    <div class="char-grid" id="char-grid"></div>
                </div>
            </div>
        </div>

        <!-- PAGE VIEW TAB -->
        <div id="tab-page" class="tab-content">
            <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Ganze Seite</h2>
                <button class="btn btn-secondary" onclick="renderPage()">Aktualisieren</button>
            </div>
            <div class="paper-view" id="paper-view"></div>
        </div>
    </main>

    <script>
        // Character Set
        const CHARS = [
            ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            ...'abcdefghijklmnopqrstuvwxyz',
            'Ä', 'Ö', 'Ü', 'ä', 'ö', 'ü', 'ß',
            '.', ',', '?', '!'
        ];

        let customFontData = {}; // Stores { 'A': [dataUrl1, dataUrl2], ... }
        let currentCharIdx = 0;
        let currentPass = 0; // 0 or 1

        // Reader state
        let words = [];
        let currentWordIdx = 0;
        let isPlaying = false;
        let wpm = 300;
        let timer = null;
        let fontSource = 'preset-1';

        // Canvas Setup
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function initCanvas() {
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', handleTouch);
            canvas.addEventListener('touchmove', handleTouch);
            canvas.addEventListener('touchend', stopDrawing);
        }

        function startDrawing(e) {
            isDrawing = true;
            ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent(
                e.type === 'touchstart' ? 'mousedown' : 'mousemove',
                { clientX: touch.clientX, clientY: touch.clientY }
            );
            canvas.dispatchEvent(mouseEvent);
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Bounding Box Crop Function to remove spacing issues
        function getCroppedCanvas() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
            let found = false;

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const alpha = imgData.data[(y * canvas.width + x) * 4 + 3];
                    if (alpha > 0) {
                        found = true;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            if (!found) return null;

            // Add small padding
            const pad = 4;
            minX = Math.max(0, minX - pad);
            minY = Math.max(0, minY - pad);
            maxX = Math.min(canvas.width, maxX + pad);
            maxY = Math.min(canvas.height, maxY + pad);

            const width = maxX - minX;
            const height = maxY - minY;

            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = width;
            cropCanvas.height = height;
            const cropCtx = cropCanvas.getContext('2d');

            cropCtx.drawImage(canvas, minX, minY, width, height, 0, 0, width, height);
            return cropCanvas.toDataURL();
        }

        function saveCharacter() {
            const dataUrl = getCroppedCanvas();
            if (!dataUrl) return;

            const char = CHARS[currentCharIdx];
            if (!customFontData[char]) customFontData[char] = [];
            
            customFontData[char][currentPass] = dataUrl;

            // Next step
            if (currentPass === 0) {
                currentPass = 1;
            } else {
                currentPass = 0;
                currentCharIdx++;
            }

            if (currentCharIdx >= CHARS.length) {
                alert('Kalibrierung abgeschlossen! Du kannst deine Handschrift jetzt im Speed Reader nutzen.');
                currentCharIdx = 0;
                switchTab('reader');
                document.getElementById('font-select').value = 'custom';
                updateFontSource('custom');
            }

            clearCanvas();
            updateCalibrationUI();
        }

        function updateCalibrationUI() {
            const char = CHARS[currentCharIdx];
            document.getElementById('target-char-display').innerText = char;
            document.getElementById('sample-count-display').innerText = `Durchgang ${currentPass + 1} von 2`;

            const grid = document.getElementById('char-grid');
            grid.innerHTML = '';
            CHARS.forEach((c, idx) => {
                const item = document.createElement('div');
                item.className = 'char-item';
                if (idx === currentCharIdx) item.classList.add('active');
                if (customFontData[c] && customFontData[c].length === 2) item.classList.add('done');
                item.innerText = c;
                item.onclick = () => {
                    currentCharIdx = idx;
                    currentPass = 0;
                    clearCanvas();
                    updateCalibrationUI();
                };
                grid.appendChild(item);
            });
        }

        // Tab Navigation
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            event.target.classList.add('active');

            if (tabId === 'page') renderPage();
        }

        // Reader Engine
        function prepareText() {
            const text = document.getElementById('text-input').value;
            words = text.trim().split(/\s+/).filter(w => w.length > 0);
            currentWordIdx = 0;
            showCurrentWord();
        }

        function updateWPM(val) {
            wpm = parseInt(val);
            document.getElementById('wpm-val').innerText = wpm;
            if (isPlaying) {
                pause();
                play();
            }
        }

        function updateFontSource(val) {
            fontSource = val;
            const display = document.getElementById('reader-display');
            display.className = 'reader-word';
            if (val.startsWith('preset-')) {
                display.classList.add(`preset-font-${val.split('-')[1]}`);
            }
            showCurrentWord();
        }

        function togglePlay() {
            if (isPlaying) pause();
            else play();
        }

        function play() {
            if (words.length === 0) prepareText();
            if (currentWordIdx >= words.length) currentWordIdx = 0;
            
            isPlaying = true;
            document.getElementById('btn-play').innerText = 'Pause';
            
            const interval = 60000 / wpm;
            timer = setInterval(() => {
                currentWordIdx++;
                if (currentWordIdx >= words.length) {
                    pause();
                    return;
                }
                showCurrentWord();
            }, interval);
        }

        function pause() {
            isPlaying = false;
            document.getElementById('btn-play').innerText = 'Start';
            clearInterval(timer);
        }

        function resetReader() {
            pause();
            currentWordIdx = 0;
            showCurrentWord();
        }

        function showCurrentWord() {
            const display = document.getElementById('reader-display');
            const word = words[currentWordIdx] || '';

            if (fontSource === 'custom') {
                display.innerHTML = '';
                for (let char of word) {
                    if (customFontData[char] && customFontData[char].length > 0) {
                        // Pick variation randomly or based on index
                        const samples = customFontData[char];
                        const src = samples[Math.floor(Math.random() * samples.length)];
                        const img = document.createElement('img');
                        img.src = src;
                        display.appendChild(img);
                    } else {
                        const span = document.createElement('span');
                        span.innerText = char;
                        display.appendChild(span);
                    }
                }
            } else {
                display.innerText = word;
            }
        }

        // Render full page view
        function renderPage() {
            const paper = document.getElementById('paper-view');
            const text = document.getElementById('text-input').value;
            paper.innerHTML = '';

            if (fontSource === 'custom') {
                const container = document.createElement('div');
                container.className = 'handwriting-container';

                for (let char of text) {
                    if (char === '\n') {
                        container.appendChild(document.createElement('br'));
                    } else if (char === ' ') {
                        const space = document.createElement('span');
                        space.style.width = '1rem';
                        space.style.display = 'inline-block';
                        container.appendChild(space);
                    } else if (customFontData[char] && customFontData[char].length > 0) {
                        const samples = customFontData[char];
                        const src = samples[Math.floor(Math.random() * samples.length)];
                        const img = document.createElement('img');
                        img.src = src;
                        container.appendChild(img);
                    } else {
                        const span = document.createElement('span');
                        span.innerText = char;
                        container.appendChild(span);
                    }
                }
                paper.appendChild(container);
            } else {
                paper.className = `paper-view preset-font-${fontSource.split('-')[1] || 1}`;
                paper.innerText = text;
            }
        }

        // Init
        initCanvas();
        updateCalibrationUI();
        prepareText();
    </script>
</body>
</html>
